# Used when you run with the "postgres" profile, e.g. when deploying:
#   SPRING_PROFILES_ACTIVE=postgres
# The values come from environment variables so passwords never go into Git.

# JDBC form, e.g. jdbc:postgresql://ep-example-123.aws.neon.tech/neondb?sslmode=require
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.h2.console.enabled=false

# The address of your deployed frontend, e.g. https://second-stitch.vercel.app
# (several allowed: separate them with commas)
app.cors-origins=${CORS_ORIGINS:http://localhost:5173}

# true = fill an empty database with the sample pieces (nice for a demo)
app.seed-sample-data=${SEED_SAMPLE_DATA:false}
