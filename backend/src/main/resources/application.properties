spring.application.name=second-stitch

# Hosts like Render tell the app which port to use through $PORT; locally it's 8080.
server.port=${PORT:8080}

# --- Database ---
# H2 saved to a file in ./data, so your closet survives restarts.
# Delete the ./data folder to start fresh.
spring.datasource.url=jdbc:h2:file:./data/closet;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
# Creates/updates tables from the @Entity classes. Fine for a portfolio project;
# real teams use migration tools like Flyway instead.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Browse the database at http://localhost:8080/h2-console
# (JDBC URL: jdbc:h2:file:./data/closet, user: sa, no password)
spring.h2.console.enabled=true

# --- Photos ---
app.upload-dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# --- Sample data on first run ---
app.seed-sample-data=true
