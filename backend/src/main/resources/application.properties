spring.application.name=second-stitch

# Hosts like Render tell the app which port to use through $PORT; locally it's 8080.
server.port=${PORT:8080}

# --- Database ---
# H2 saved to a file in ./data, so your closet survives restarts.
# Delete the ./data folder to start fresh.
spring.datasource.url=jdbc:h2:file:./data/closet;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
# Creates/updates tables from the @Entity classes. Fine for a portfolio project;
# real teams use migration tools like Flyway instead.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Browse the database at http://localhost:8080/h2-console
# (JDBC URL: jdbc:h2:file:./data/closet, user: sa, no password)
spring.h2.console.enabled=true

# --- Photos ---
# Photos are stored in the database (item_photo table), so they survive restarts.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# --- Accounts ---
# Secret key that signs login tokens. Leave unset on your laptop (a random one is made,
# so restarting logs you out). Always set JWT_SECRET on the live site.
app.jwt-secret=${JWT_SECRET:}

# --- Emails (confirm your email, forgot password) ---
# Sent through Brevo, from your verified Gmail address. Without BREVO_API_KEY and MAIL_FROM,
# emails are printed in the console instead (handy on your laptop).
app.brevo-api-key=${BREVO_API_KEY:}
app.mail-from=${MAIL_FROM:}
app.mail-from-name=${MAIL_FROM_NAME:Second Stitch}
# Where the links in emails point: your website (the Vercel address on the live site)
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# --- Sample closet for each new account ---
app.seed-sample-data=true
